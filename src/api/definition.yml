openapi: 3.0.2
info:
  title: Oceanic API
  version: 0.1.0

components:
  responses:
    unauthorized:
      description: ID token is absent or malformed
  parameters:
    user:
      in: path
      name: user
      required: true
      schema:
        oneOf:
          - $ref: "compiled-schemas/uuid.json"
          - enum:
              - me
  securitySchemes:
    userPool:
      type: "apiKey"
      name: "Authorization"
      in: "header"
      x-amazon-apigateway-authtype: "cognito_user_pools"

x-amazon-apigateway-request-validators:
  all:
    validateRequestBody: true
    validateRequestParameters: true
x-amazon-apigateway-request-validator: all

paths:
  /test:
    get:
      x-lambda-entry: test.ts
      responses:
        '200':
          description: OK
  
  /auth:
    description: This endpoint will match the API docs for AWS Cognito user pools
    x-generation-exclude: true
    post:
      description: "This endpoint will match [AWS Cognito](https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-userpools-api-reference.html)\n\nPasswords should be hashed before being sent to the server. Use PBKDF2, 600000 iterations, with a salt of the username (utf-8 encoded)."
      responses:
        "200":
          description: OK

  /users/{user}/documents:
    get:
      security:
        - userPool: []
      x-lambda-entry: document/list.ts
      x-lambda-dependencies:
        - document-metadata-read
      summary: List documents.
      tags:
        - documents
      parameters:
        - $ref: "#/components/parameters/user"
      responses:
        "200":
          description: A list of all the documents 
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "compiled-schemas/document-part.json"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          description: The authenticated user doesn't match the `user` parameter. (You're only allowed to list your own documents)
    post:
      security:
        - userPool: []
      x-lambda-entry: document/create.ts
      x-lambda-dependencies:
        - document-metadata-write
        - s3-signing
      summary: Create a new document.
      tags:
        - documents
      requestBody:
        description: Metadata for the new document.
        content:
          application/json:
            schema:
              $ref: "compiled-schemas/document-create.json"
      responses:
        "200":
          description: The document was created successfully.
          content:
            application/json:
              schema:
                $ref: "compiled-schemas/document.json"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          description: "The authenticated user isn't allowed to create a document. This will happen if they're trying to create a document for another user, or they're no longer allowed write access on their own account."

  /users/{user}/documents/{document}:
    get:
      security:
        - userPool: []
      x-lambda-entry: document/get.ts
      x-lambda-dependencies:
        - document-metadata-read
        - s3-signing
      summary: Get document metadata.
      tags:
        - documents
      parameters:
        - $ref: "#/components/parameters/user"
        - in: path
          name: document
          required: true
          schema:
            $ref: "compiled-schemas/uuid.json"
      responses:
        "200":
          description: A document
          content:
            application/json:
              schema:
                $ref: "compiled-schemas/document.json"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          description: The authenticated user doesn't have access to this document
        "404":
          description: The document doesn't exist. This will only be returned if the authenticated user *would've* had access, had it existed. In other words, if the they're the same user as the one specified in the `user` parameter.
    patch:
      security:
        - userPool: []
      x-lambda-entry: document/update.ts
      x-lambda-dependencies:
        - document-metadata-write
      summary: Update document metadata.
      tags:
        - documents
      parameters:
        - $ref: "#/components/parameters/user"
        - in: path
          name: document
          required: true
          schema:
            $ref: "compiled-schemas/uuid.json"
      requestBody:
        description: A JSON Patch document describing the changes to the metadata.
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                $ref: "compiled-schemas/json-patch.json"
      responses:
        "200":
          description: The updated metadata.
          content:
            application/json:
              schema:
                $ref: "compiled-schemas/document.json"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          description: The authenticated user doesn't have access to this document
        "404":
          description: The document doesn't exist. This will only be returned if the authenticated user *would've* had access, had it existed. In other words, if the they're the same user as the one specified in the `user` parameter.
